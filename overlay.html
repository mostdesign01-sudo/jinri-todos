<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>今日待办 · 悬浮窗</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="overlay">
  <div class="widget">
    <div class="drag-handle" title="拖动"><i></i></div>
    <div class="widget-body">
      <div class="overlay-head">
        <div class="overlay-brand">
          <h1>今日待办</h1>
          <div class="overlay-date" id="overlay-date"></div>
        </div>
        <button type="button" class="lantern lantern-sm" id="lantern" data-mood="idle" aria-label="提醒灯笼">
          <span class="lantern-say" id="lantern-say" hidden></span>
          <svg class="lantern-svg" viewBox="0 0 64 88" aria-hidden="true">
            <line class="lantern-cord" x1="32" y1="2" x2="32" y2="12" />
            <rect class="lantern-cap" x="22" y="10" width="20" height="6" rx="2" />
            <ellipse class="lantern-glow" cx="32" cy="40" rx="22" ry="24" />
            <path class="lantern-body" d="M16 22c0-2 4-4 16-4s16 2 16 4v32c0 8-6 14-16 14S16 62 16 54V22z" />
            <path class="lantern-rib" d="M32 18v48M20 26c6 3 18 3 24 0M20 40c6 3 18 3 24 0M20 52c6 2 18 2 24 0" />
            <g class="lantern-face">
              <ellipse class="lantern-eye" cx="25" cy="38" rx="3.2" ry="3.6" />
              <ellipse class="lantern-eye" cx="39" cy="38" rx="3.2" ry="3.6" />
              <path class="lantern-mouth" d="M28 47c2 2.4 6 2.4 8 0" />
            </g>
            <ellipse class="lantern-flame" cx="32" cy="40" rx="5" ry="8" />
            <rect class="lantern-base" x="24" y="66" width="16" height="5" rx="1.5" />
            <path class="lantern-tassel" d="M32 71v10" />
            <circle class="lantern-bead" cx="32" cy="83" r="2.2" />
          </svg>
        </button>
        <div class="remain" id="remain"></div>
      </div>
      <form class="add-row" id="add-form" autocomplete="off">
        <div class="prios" id="prios"></div>
        <input id="title-input" class="title-input" name="title" maxlength="120" placeholder="回车添加" />
      </form>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    const { PRIORITIES } = Jinri;
    let addPriority = "medium";

    function drawPrios() {
      const root = document.getElementById("prios");
      root.innerHTML = PRIORITIES.map((p) =>
        `<button type="button" class="prio-btn${p.id === addPriority ? " on" : ""}" data-p="${p.id}">${p.label}</button>`
      ).join("");
      root.querySelectorAll(".prio-btn").forEach((btn) => {
        btn.addEventListener("click", () => { addPriority = btn.dataset.p; drawPrios(); });
      });
    }

    function render() {
      const today = Jinri.shanghaiDateStr();
      const overdue = Jinri.overdueTodos();
      const todayItems = Jinri.todosOnDate(today, false);
      const n = overdue.length + todayItems.length;
      document.getElementById("overlay-date").textContent = Jinri.formatShortDate(today);
      document.getElementById("remain").textContent = n
        ? (overdue.length ? `还有${n}件 · ${overdue.length}逾期` : `还有${n}件`)
        : "都做完了";
      const state = Jinri.reminderState();
      const lantern = document.getElementById("lantern");
      const say = document.getElementById("lantern-say");
      lantern.dataset.mood = state.mood;
      const show = state.mood === "dusk" || state.mood === "night" || state.mood === "overdue";
      say.hidden = !show;
      say.textContent = state.text;
      const list = document.getElementById("list");
      if (!n) {
        list.innerHTML = `<div class="empty">空空的一天。</div>`;
      } else {
        let html = "";
        if (overdue.length) {
          html += `<div class="sec-label warn">逾期</div>`;
          html += overdue.map((t) => itemHtml(t, true)).join("");
          if (todayItems.length) html += `<div class="sec-label">今天</div>`;
        }
        html += todayItems.map((t) => itemHtml(t, false)).join("");
        list.innerHTML = html;
      }
      drawPrios();
    }

    function itemHtml(t, showDate) {
      const dateTag = showDate ? `<span>${Jinri.formatShortDate(t.date)}</span>` : "";
      return `
        <article class="item${showDate ? " overdue" : ""}" data-p="${t.priority}" data-id="${t.id}">
          <button class="check" type="button" aria-label="完成" data-act="toggle"></button>
          <div class="mid">
            <div class="meta"><span class="tag">${Jinri.priorityLabel(t.priority)}</span>${dateTag}${t.sample ? `<span>示例</span>` : ""}</div>
            <div class="title">${escapeHtml(t.title)}</div>
          </div>
        </article>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("title-input");
      Jinri.addTodo(input.value, addPriority);
      input.value = "";
      render();
    });

    document.getElementById("list").addEventListener("click", (e) => {
      const item = e.target.closest(".item");
      if (!item) return;
      if (e.target.closest("[data-act]")?.dataset.act === "toggle") {
        Jinri.toggleTodo(item.dataset.id);
        render();
      }
    });

    document.addEventListener("keydown", (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea";
      if (e.key === "n" && !typing) {
        e.preventDefault();
        document.getElementById("title-input").focus();
      }
      if (["1","2","3","4"].includes(e.key) && !typing) {
        addPriority = PRIORITIES[Number(e.key) - 1].id;
        drawPrios();
      }
    });

    render();
  </script>
</body>
</html>
