<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />
  <title>今日待办 · 悬浮窗</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="overlay">
  <svg class="lg-defs" aria-hidden="true" focusable="false">
    <filter id="liquid-glass" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur" />
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="2" seed="4" result="noise" />
      <feDisplacementMap in="blur" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="widget">
    <div class="drag-handle" title="拖动"><i></i></div>
    <div class="widget-body">
      <div class="native-bar" id="native-bar" hidden>
        <button type="button" class="ghost-btn on" id="native-pin">置顶</button>
        <button type="button" class="ghost-btn" id="native-export">导出</button>
        <button type="button" class="ghost-btn" id="native-import">导入</button>
        <button type="button" class="ghost-btn" id="native-close">关闭</button>
        <input id="native-import-file" type="file" accept="application/json,.json" hidden />
      </div>
      <div class="overlay-head">
        <div class="overlay-brand">
          <h1>今日待办</h1>
          <div class="overlay-date" id="overlay-date"></div>
        </div>
        <button type="button" class="lantern lantern-sm" id="lantern" data-mood="idle" aria-label="提醒小鲨">
          <span class="lantern-say" id="lantern-say" hidden></span>
          <svg class="lantern-svg" viewBox="0 0 72 80" aria-hidden="true">
            <ellipse class="lantern-glow" cx="36" cy="46" rx="28" ry="24" />
            <path class="shark-fin" d="M36 4l10 22H26z" />
            <path class="shark-fin" d="M15 30L2 16l20 22z" />
            <path class="shark-fin" d="M57 30l13-14L50 38z" />
            <circle class="lantern-body" cx="36" cy="44" r="18.5" />
            <path class="shark-snout" d="M36 58l9 14H27z" />
            <ellipse class="bot-face" cx="36" cy="43" rx="13" ry="10.5" />
            <ellipse class="lantern-eye" cx="30" cy="42.5" rx="3.5" ry="4.4" />
            <ellipse class="lantern-eye" cx="42" cy="42.5" rx="3.5" ry="4.4" />
            <circle class="eye-shine" cx="31.3" cy="41" r="1.15" />
            <circle class="eye-shine" cx="43.3" cy="41" r="1.15" />
            <path class="lantern-mouth" d="M32 50.5c2 2.3 6 2.3 8 0" />
          </svg>
        </button>
        <div class="remain" id="remain"></div>
      </div>
      <form class="add-row" id="add-form" autocomplete="off">
        <div class="prios" id="prios"></div>
        <input id="title-input" class="title-input" name="title" maxlength="120" placeholder="回车添加" />
      </form>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    const { PRIORITIES } = Jinri;
    let addPriority = "medium";

    function drawPrios() {
      const root = document.getElementById("prios");
      root.innerHTML = PRIORITIES.map((p) =>
        `<button type="button" class="prio-btn${p.id === addPriority ? " on" : ""}" data-p="${p.id}">${p.label}</button>`
      ).join("");
      root.querySelectorAll(".prio-btn").forEach((btn) => {
        btn.addEventListener("click", () => { addPriority = btn.dataset.p; drawPrios(); });
      });
    }

    function render() {
      const today = Jinri.shanghaiDateStr();
      const overdue = Jinri.overdueTodos();
      const todayItems = Jinri.todosOnDate(today, false);
      const later = Jinri.upcomingGroups();
      const laterN = later.reduce((s, g) => s + g.items.length, 0);
      const n = overdue.length + todayItems.length;
      document.getElementById("overlay-date").textContent = Jinri.formatShortDate(today);
      document.getElementById("remain").textContent = n
        ? (overdue.length ? `还有${n}件 · ${overdue.length}逾期` : `还有${n}件`)
        : "都做完了";
      const state = Jinri.reminderState();
      const lantern = document.getElementById("lantern");
      const say = document.getElementById("lantern-say");
      lantern.dataset.mood = state.mood;
      const show = state.mood === "dusk" || state.mood === "night" || state.mood === "overdue";
      say.hidden = !show;
      say.textContent = state.text;
      const list = document.getElementById("list");
      if (!n && !laterN) {
        list.innerHTML = `<div class="empty">空空的一天。</div>`;
      } else {
        let html = "";
        if (overdue.length) {
          html += `<div class="sec-label warn">逾期</div>`;
          html += overdue.map((t) => itemHtml(t, true)).join("");
          if (todayItems.length) html += `<div class="sec-label">今天</div>`;
        }
        html += todayItems.map((t) => itemHtml(t, false)).join("");
        if (later.length) {
          html += `<div class="sec-label">陆续</div>`;
          later.forEach((group) => {
            html += `<div class="sec-date">${Jinri.formatShortDate(group.date)}</div>`;
            html += group.items.map((t) => itemHtml(t, false)).join("");
          });
        }
        list.innerHTML = html;
      }
      drawPrios();
    }

    function itemHtml(t, showDate) {
      const dateTag = showDate ? `<span>${Jinri.formatShortDate(t.date)}</span>` : "";
      return `
        <article class="item${showDate ? " overdue" : ""}" data-p="${t.priority}" data-id="${t.id}">
          <button class="check" type="button" aria-label="完成" data-act="toggle"></button>
          <div class="mid">
            <div class="meta"><span class="tag">${Jinri.priorityLabel(t.priority)}</span>${dateTag}${t.sample ? `<span>示例</span>` : ""}</div>
            <div class="title">${escapeHtml(t.title)}</div>
          </div>
        </article>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("title-input");
      Jinri.addTodo(input.value, addPriority);
      input.value = "";
      render();
    });

    document.getElementById("list").addEventListener("click", (e) => {
      const item = e.target.closest(".item");
      if (!item) return;
      if (e.target.closest("[data-act]")?.dataset.act === "toggle") {
        Jinri.toggleTodo(item.dataset.id);
        render();
      }
    });

    document.addEventListener("keydown", (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea";
      if (e.key === "n" && !typing) {
        e.preventDefault();
        document.getElementById("title-input").focus();
      }
      if (["1","2","3","4"].includes(e.key) && !typing) {
        addPriority = PRIORITIES[Number(e.key) - 1].id;
        drawPrios();
      }
    });

    function nativeBridge() {
      try {
        return window.webkit && webkit.messageHandlers && webkit.messageHandlers.jinri;
      } catch (e) {
        return null;
      }
    }
    function nativeSend(msg) {
      const bridge = nativeBridge();
      if (bridge) bridge.postMessage(msg);
    }

    const pageParams = new URLSearchParams(location.search);
    const isNative = pageParams.has("native") || !!nativeBridge();
    if (pageParams.has("glass") || isNative) document.documentElement.classList.add("glass");
    if (isNative) {
      document.documentElement.classList.add("native");
      const bar = document.getElementById("native-bar");
      bar.hidden = false;
      const pinBtn = document.getElementById("native-pin");
      pinBtn.addEventListener("click", () => {
        const on = !pinBtn.classList.contains("on");
        pinBtn.classList.toggle("on", on);
        nativeSend(on ? "pin" : "unpin");
      });
      document.getElementById("native-close").addEventListener("click", () => {
        nativeSend("quit");
        try { window.close(); } catch (e) {}
      });
      // 无边框窗口靠原生端拖动；按住手柄或标题区即可拖。
      [document.querySelector(".drag-handle"), document.querySelector(".overlay-brand")].forEach((el) => {
        el.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          nativeSend("drag");
        });
      });
      window.__jinriImport = (text) => {
        try {
          Jinri.importJson(String(text || ""));
          render();
        } catch (err) {
          alert("导入失败，请选今天待办导出的 JSON。");
        }
      };
      document.getElementById("native-export").addEventListener("click", () => {
        if (nativeBridge()) {
          nativeSend("export:" + Jinri.exportJson());
          return;
        }
        const blob = new Blob([Jinri.exportJson()], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "jinri-todos.json";
        a.click();
        URL.revokeObjectURL(a.href);
      });
      document.getElementById("native-import").addEventListener("click", () => {
        if (nativeBridge()) {
          nativeSend("import");
          return;
        }
        document.getElementById("native-import-file").click();
      });
      document.getElementById("native-import-file").addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => window.__jinriImport(reader.result);
        reader.readAsText(file, "utf-8");
        e.target.value = "";
      });
    }
    window.addEventListener("storage", (e) => {
      if (e.key === Jinri.STORAGE_KEY) render();
    });

    render();
  </script>
</body>
</html>
